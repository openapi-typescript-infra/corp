type: object
required:
  - name
  - group_type
properties:
  parent_group_id:
    type: string
    format: uuid
  name:
    type: array
    items:
      type: string
  group_type:
    type: string
  display_name:
    type: string
  identifiers:
    type: array
    items:
      oneOf:
        - $ref: ./GroupIdentifierInput.yaml
        - $ref: ./GroupIdentifier.yaml
  profiles:
    type: array
    items:
      $ref: ./ProfileEntry.yaml
  addresses:
    type: array
    items:
      $ref: ./IndividualAddress.yaml
  consents:
    type: array
    items:
      $ref: ./GroupConsent.yaml
  parents:
    type: array
    items:
      $ref: ./GroupSummary.yaml
  children:
    type: array
    items:
      $ref: ./GroupSummary.yaml
